version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: contracts_db_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-contracts_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contracts_api
    restart: always
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    environment:
      - PORT=${PORT:-3001}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password}@db:5432/${DB_NAME:-contracts_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_change_in_production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - db

volumes:
  postgres_data:
