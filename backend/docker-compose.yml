version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: contracts_db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: contracts_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contracts_api
    restart: always
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/contracts_db?schema=public
      - JWT_SECRET=dev_secret_key_change_in_production
    depends_on:
      - db

volumes:
  postgres_data:
